<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="Random.css">
    <title>Tugas Praktikum 4</title>
</head>
<body>
    <h1 class="judul-tugas">TUGAS TOMBOL ALBERTA DAVIN</h1>
    <button type="button" id="tombol">ID SAYA</button>
    <button type="button" id="tombol2">UNTUK HAPUS ID</button>
    
    <div id="container-id"></div>
    <script> 
    const container = document.getElementById('container-id');
        function buttonClick() {
           container.innerHTML = "<div><p>Nama : Alberta Davin</p><p>NIM : 825250007</p></div>";
        }
        
        // Event handling dengan fungsi anonim
        document.getElementById('tombol').addEventListener('click', buttonClick);
        
        document.getElementById('tombol2').addEventListener('click', function() {
            container.innerHTML = "";
        });
        // Event handling dengan arrow function
        document.addEventListener('keydown', (event) => {
            console.log('Tombol keyboard ditekan:', event.key);
        });
    </script>
</body>
</html>
